name: frames
on: workflow_dispatch
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          curl -sL -o v.mp4 "https://video.twimg.com/amplify_video/2105202222481244160/vid/avc1/1920x1080/zGDbjq0IShu4oMcd.mp4"
          mkdir -p ref/okara
          ffmpeg -hide_banner -i v.mp4 -vf "fps=3,scale=480:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{pts\\:hms}':x=6:y=6:fontsize=22:fontcolor=yellow:box=1:boxcolor=black@0.7,tile=4x3:padding=4" -q:v 3 ref/okara/sheet_%02d.jpg
          ffmpeg -hide_banner -i v.mp4 -vf "select='gt(scene,0.25)',showinfo" -f null - 2>&1 | grep -o "pts_time:[0-9.]*" > ref/okara/cuts.txt || true
          git config user.name bot && git config user.email bot@x
          git add ref && git commit -m frames && git push
