name: render
on:
  workflow_dispatch:
    inputs:
      script_id:
        required: true
      token:
        required: true
      api:
        required: true
concurrency:
  group: render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Masquer le jeton
        run: echo "::add-mask::${{ inputs.token }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: npm install --no-audit --no-fund
      - name: Cache du clonage de voix
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voice-clone-v1
      - name: Clonage de voix (Chatterbox)
        continue-on-error: true
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git"
      - name: Montage
        run: node src/main.mjs
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          JOB_TOKEN: ${{ inputs.token }}
          API_URL: ${{ inputs.api }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
