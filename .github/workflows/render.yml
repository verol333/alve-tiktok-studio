name: render
on:
  workflow_dispatch:
    inputs:
      script_id:
        required: true
      token:
        required: true
      api:
        required: true
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Masquer le jeton
        run: echo "::add-mask::${{ inputs.token }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: npm install --no-audit --no-fund
      - name: Montage
        run: node src/main.mjs
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          JOB_TOKEN: ${{ inputs.token }}
          API_URL: ${{ inputs.api }}
